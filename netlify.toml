[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from   = "/api/claude"
  to     = "/.netlify/functions/claude"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
